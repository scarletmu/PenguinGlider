name: Release

# 推送形如 v0.1.0 的 tag 时触发：交叉编译 macOS 二进制并发布 GitHub Release。
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # 创建 Release / 上传 asset 需要写权限

jobs:
  build:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-apple-darwin # Apple Silicon
          - x86_64-apple-darwin # Intel
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        run: |
          cd target/${{ matrix.target }}/release
          tarball="pglider-${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz"
          tar czf "$tarball" pglider
          shasum -a 256 "$tarball" > "$tarball.sha256"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          # 自动按 commit 历史生成 Release notes；多个 matrix job 追加 asset 到同一个 Release
          generate_release_notes: true
          files: |
            target/${{ matrix.target }}/release/pglider-*.tar.gz
            target/${{ matrix.target }}/release/pglider-*.tar.gz.sha256
